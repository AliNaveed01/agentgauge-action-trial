name: arithmetic-bot
provider:
  type: fake
  model: calculator
  responses:
    "2+2?": "4"
    "3+3?": "7"
    "5+5?": "11"
    "7+1?": "9"
    "9-4?": "6"
    "6*2?": "13"
    "10/2?": "6"
    "1+1?": "3"
    "8-3?": "6"
    "4*4?": "16"
    "12-5?": "7"
    "3*3?": "9"
scorers: [exact_match]
cases:
