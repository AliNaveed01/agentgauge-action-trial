  - {id: q02, input: "3+3?", expected: "6"}
  - {id: q03, input: "5+5?", expected: "10"}
  - {id: q04, input: "7+1?", expected: "8"}
  - {id: q05, input: "9-4?", expected: "5"}
  - {id: q06, input: "6*2?", expected: "12"}
  - {id: q07, input: "10/2?", expected: "5"}
  - {id: q08, input: "1+1?", expected: "2"}
  - {id: q09, input: "8-3?", expected: "5"}
  - {id: q10, input: "4*4?", expected: "16"}
  - {id: q11, input: "12-5?", expected: "7"}
  - {id: q12, input: "3*3?", expected: "9"}
